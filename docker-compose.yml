# Local development services. Start with `pnpm services:up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobify
      POSTGRES_PASSWORD: jobify
      POSTGRES_DB: jobify
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for CVs, photos and logos (Cloudflare R2 in production).
  # Runs without S3 auth locally; the API creates the bucket on startup.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Video calls for interviews. Dev mode: API key "devkey", secret "secret".
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres-data:
  seaweedfs-data:
