name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobify
          POSTGRES_PASSWORD: jobify
          POSTGRES_DB: jobify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobify:jobify@localhost:5432/jobify
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Test-only secret; real secrets live in the hosting provider.
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      S3_ENDPOINT: http://localhost:8333

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Service containers can't take a command, so start the S3 store here.
      - name: Start object storage (SeaweedFS S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:latest \
            server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8333/ && exit 0; sleep 1; done
          docker logs seaweedfs; exit 1

      - name: Build (also generates the Prisma client)
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
